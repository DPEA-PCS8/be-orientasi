spring:
  application:
    name: orientasi
    
  # Database Configuration
  datasource:
    url: jdbc:sqlserver://${DB_HOST:10.226.60.31}:${DB_PORT:49705};databaseName=${DB_NAME:pcs8_orientasi};encrypt=true;trustServerCertificate=true
    username: ${DB_USERNAME:admin.pcs8}
    password: ${DB_PASSWORD:}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
    
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.SQLServerDialect
        "[format_sql]": true 
    
  # LDAP Configuration
  ldap:
    urls: ldap://10.225.60.10:389
    base: dc=devojk,dc=go,dc=id
  
  # File Upload Configuration
  servlet:
    multipart:
      max-file-size: 8MB
      max-request-size: 8MB
      enabled: true

server:
  port: 8080
  servlet:
    context-path: /api

# JWT Configuration
jwt:
  secret: ${JWT_SECRET:}
  expiration: ${JWT_EXPIRATION:86400000}  # 24 hours in milliseconds

# RSA Encryption Configuration
rsa:
  encryption:
    private-key: ${RSA_PRIVATE_KEY:}  # Empty by default - will auto-generate on startup
    public-key: ${RSA_PUBLIC_KEY:}    # Empty by default - will auto-generate on startup
# API Security Configuration
app:
  api-key: ${API_KEY:}

# Logging
logging:
  level:
    "[com.pcs8.orientasi]": INFO
    "[org.springframework.security]": DEBUG

# External Catalog Configuration
catalog:
  base-url: ${CATALOG_BASE_URL:http://application-catalog-internal-dpea.apps.ocp.ojk.go.id}

# SSO Configuration
# NOTE: client-id / client-secret below are the CATALOG client_credentials client
# (consumed by SsoTokenClient — separate concern, do not repurpose).
# login-client-id / login-client-secret are the OIDC LOGIN (BFF) client used by
# SsoOAuthProperties / SsoAuthService for the authorization-code + PKCE flow.
sso:
  base-url: ${SSO_BASE_URL:http://auth-web.sso-engine-dev.svc.cluster.local}
  client-id: ${SSO_CLIENT_ID:MGRFFQ75DGU6KPQR4GJD}
  client-secret: ${SSO_CLIENT_SECRET:}
  login-client-id: ${SSO_LOGIN_CLIENT_ID:P1VHAIF287355UAN2UTG}
  login-client-secret: ${SSO_LOGIN_CLIENT_SECRET:}
  redirect-uri: ${SSO_REDIRECT_URI:https://localhost:5174/signin-oidc}
  frontend-callback-url: ${SSO_FE_CALLBACK:https://localhost:5174/signin-oidc}
  scopes: ${SSO_SCOPES:openid email profile roles}
  token-buffer-seconds: ${SSO_TOKEN_BUFFER_SECONDS:50}

# Minio Configuration
minio:
  endpoint: ${MINIO_ENDPOINT:http://miniodev.ojk.go.id:9000}
  access-key: ${MINIO_ACCESS_KEY:}
  secret-key: ${MINIO_SECRET_KEY:}
  bucket-name: ${MINIO_BUCKET:kkad}
