spring:
  application:
    name: orientasi
    
  # Database Configuration
  datasource:
    url: jdbc:sqlserver://${DB_HOST:10.226.60.31}:${DB_PORT:49705};databaseName=${DB_NAME:pcs8_orientasi};encrypt=true;trustServerCertificate=true
    username: ${DB_USERNAME:admin.pcs8}
    password: ${DB_PASSWORD:}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
    
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.SQLServerDialect
        "[format_sql]": true 
    
  # File Upload Configuration
  servlet:
    multipart:
      max-file-size: 8MB
      max-request-size: 8MB
      enabled: true

server:
  port: 8080
  servlet:
    context-path: /api

# JWT Configuration
jwt:
  secret: ${JWT_SECRET:}
  expiration: ${JWT_EXPIRATION:86400000}  # 24 hours in milliseconds

# API Security Configuration
app:
  api-key: ${API_KEY:}

# Logging
logging:
  level:
    "[com.pcs8.orientasi]": INFO
    "[org.springframework.security]": DEBUG

# CORS allowed origins (comma-separated, no wildcard). Set FE origin(s) per environment.
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:https://localhost:5174}

# External Catalog Configuration
catalog:
  base-url: ${CATALOG_BASE_URL:http://application-catalog-internal-dpea.apps.ocp.ojk.go.id}

# SSO Configuration
# Single confidential client (dual-grant on the SSO side): used BOTH by SsoTokenClient
# (catalog client_credentials) and by SsoAuthService (OIDC login authorization_code + PKCE).
sso:
  base-url: ${SSO_BASE_URL:https://auth-web-sso-engine-dev.apps.ocp.ojk.go.id}
  client-id: ${SSO_CLIENT_ID:P1VHAIF287355UAN2UTG}
  client-secret: ${SSO_CLIENT_SECRET:}
  redirect-uri: ${SSO_REDIRECT_URI:https://localhost:5174/signin-oidc}
  # Must be registered as a PostLogoutRedirectUri on the SSO client.
  post-logout-redirect-uri: ${SSO_POST_LOGOUT_URI:https://localhost:5174/signout-callback-oidc}
  scopes: ${SSO_SCOPES:openid email profile}
  token-buffer-seconds: ${SSO_TOKEN_BUFFER_SECONDS:50}
  # DEV ONLY: trust SSO server's internal-CA cert (fixes "PKIX path building failed").
  # NEVER true in prod — import the SSO CA into the JVM truststore instead.
  trust-all-certs: ${SSO_TRUST_ALL_CERTS:true}

# Minio Configuration
minio:
  endpoint: ${MINIO_ENDPOINT:http://miniodev.ojk.go.id:9000}
  access-key: ${MINIO_ACCESS_KEY:}
  secret-key: ${MINIO_SECRET_KEY:}
  bucket-name: ${MINIO_BUCKET:kkad}
